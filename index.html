<title>Private AI Infrastructure · Interactive 3D Map</title>
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(13, 18, 30, 0.88);
    --border: rgba(90, 140, 255, 0.22);
    --text: #d7e3f8;
    --dim: #7d8db0;
    --accent: #5aa0ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; color: var(--text); }
  #scene { position: fixed; inset: 0; }

  .hud { position: fixed; z-index: 10; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  #title { top: 18px; left: 22px; }
  #title h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text); }
  #title p { font-size: 11px; color: var(--dim); margin-top: 4px; letter-spacing: 0.05em; }
  #title p b { color: var(--accent); font-weight: 600; }

  #searchbox { top: 64px; left: 22px; }
  #search {
    width: 236px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); font: inherit; font-size: 11px; padding: 8px 11px; outline: none;
    backdrop-filter: blur(8px); letter-spacing: 0.05em; transition: border-color 0.2s;
  }
  #search:focus { border-color: rgba(90, 160, 255, 0.6); }
  #search::placeholder { color: var(--dim); }

  #legend { top: 18px; right: 22px; background: var(--panel); border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(8px); min-width: 176px; }
  #legend h2 { font-size: 10px; letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; }
  .lg-item { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 3px 5px; margin: 0 -5px;
             color: var(--text); cursor: pointer; border-radius: 6px; transition: background 0.15s; }
  .lg-item:hover { background: rgba(90, 160, 255, 0.10); }
  .lg-item.active { background: rgba(90, 160, 255, 0.16); }
  .lg-item .lg-count { margin-left: auto; color: var(--dim); font-size: 10px; }
  .lg-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; box-shadow: 0 0 6px currentColor; }

  #layers { bottom: 20px; left: 22px; background: var(--panel); border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(8px); }
  #layers h2 { font-size: 10px; letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; }
  #layers label { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 3px 0; cursor: pointer; user-select: none; }
  #layers input { accent-color: var(--accent); }
  #layers .hint { margin-top: 8px; font-size: 10px; color: var(--dim); line-height: 1.6; }
  #layers kbd { background: rgba(90, 160, 255, 0.12); border: 1px solid var(--border); border-radius: 4px;
                padding: 0 4px; font: inherit; font-size: 9px; color: var(--text); }
  #tour {
    margin-top: 9px; width: 100%; background: rgba(90, 160, 255, 0.10); color: var(--accent);
    border: 1px solid var(--border); border-radius: 7px; font: inherit; font-size: 10.5px;
    letter-spacing: 0.1em; padding: 6px 8px; cursor: pointer; text-transform: uppercase; transition: background 0.15s;
  }
  #tour:hover { background: rgba(90, 160, 255, 0.2); }
  #tour.on { background: rgba(90, 160, 255, 0.3); color: #fff; }

  #info { bottom: 20px; right: 22px; width: 300px; background: var(--panel); border: 1px solid var(--border);
          border-radius: 10px; padding: 14px 16px; backdrop-filter: blur(8px); display: none; }
  #info.open { display: block; }
  #info h3 { font-size: 13px; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 2px; }
  #info .cat { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 8px; }
  #info p { font-size: 11.5px; line-height: 1.55; color: var(--text); }
  #info .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
  #info .tag { font-size: 10px; color: var(--dim); border: 1px solid var(--border); border-radius: 20px; padding: 2px 8px; }
  #info .close { position: absolute; top: 8px; right: 12px; cursor: pointer; color: var(--dim); font-size: 14px; background: none; border: none; }
  #info .close:hover { color: var(--text); }
  #copy-link { margin-top: 10px; background: none; border: 1px solid var(--border); border-radius: 6px;
               color: var(--dim); font: inherit; font-size: 10px; letter-spacing: 0.08em; padding: 4px 8px; cursor: pointer; }
  #copy-link:hover { color: var(--text); border-color: rgba(90, 160, 255, 0.5); }

  #tip { position: fixed; z-index: 20; pointer-events: none; display: none; max-width: 280px;
         background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
         padding: 6px 10px; font-size: 11px; color: var(--text); backdrop-filter: blur(8px); }
  #tip .t2 { color: var(--dim); font-size: 10px; letter-spacing: 0.06em; }

  #help { bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--dim); letter-spacing: 0.08em; }
  #help kbd { color: var(--dim); }

  #loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: var(--bg); z-index: 100; transition: opacity 0.6s; font-size: 12px; color: var(--dim); letter-spacing: 0.2em; }
  #loader.done { opacity: 0; pointer-events: none; }

  @media (max-width: 760px) {
    #legend { display: none; }
    #search { width: 170px; }
    #info { left: 12px; right: 12px; width: auto; bottom: 12px; }
    #help { display: none; }
    #layers { left: 12px; bottom: 12px; padding: 9px 11px; }
  }
  @media (hover: none) { #tip { display: none !important; } }
</style>
</head>

const platformEdges = [];
function makePlatform(cx, cz, w, d, color, label) {
  const geo = new THREE.BoxGeometry(w, 0.35, d);

  const pts = [];
  const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
  for (const [sx, sz] of corners) {
    const x0 = cx + sx * hw, z0 = cz + sz * hd;
    pts.push(x0, y, z0, x0 - sx * L, y, z0);

  const sprite = makeLabel(label, { size: 0.8, color: '#8fa3cc' });

function injectFresnel(mat, colorHex, strength) {
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uRimColor = { value: new THREE.Color(colorHex) };
    shader.uniforms.uRimPower = { value: 2.4 };
    shader.uniforms.uRimStrength = { value: strength };
    shader.fragmentShader = shader.fragmentShader
      .replace('void main() {', 'uniform vec3 uRimColor;\nuniform float uRimPower;\nuniform float uRimStrength;\nvoid main() {')
      .replace('#include <emissivemap_fragment>',
        '#include <emissivemap_fragment>\n' +
        '  float rimF = pow(1.0 - saturate(dot(normalize(vNormal), normalize(vViewPosition))), uRimPower);\n' +
        '  totalEmissiveRadiance += uRimColor * rimF * uRimStrength;\n');
  };
  mat.customProgramCacheKey = () => 'fresnel-rim';
}

function makeNode(def) {
  const cat = CATEGORIES[def.cat];

    emissive: cat.color, emissiveIntensity: isOverlay ? 0.35 : 0.18,
    transparent: true, opacity: isOverlay ? 0.85 : 1,
    wireframe: isOverlay,
  });
  if (!isOverlay) injectFresnel(mat, cat.color, 0.85);
  const mesh = new THREE.Mesh(geo, mat);

  let edge = null;

  // glow halo

  const label = makeLabel(def.label, { color: def.cat === 'client' ? '#ffffff' : '#cfe0ff' });
  label.position.y = isOverlay ? 1.7 : 1.42 + Math.max(0, 3.2 - def.pos[2]) * 0.055;
  group.add(label);

  group.position.fromArray(def.pos);

  // contact shadow + pedestal ring on platforms

  }

  mesh.userData.nodeDef = def;

    def, group, mesh, edge, halo, label,
    baseY: def.pos[1],
    baseEmissive: isOverlay ? 0.35 : 0.18,

}

function makeGlowSprite(color) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const ctx = cv.getContext('2d');
  const grad = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
  const c = '#' + color.toString(16).padStart(6, '0');
  grad.addColorStop(0, c + 'aa');
  grad.addColorStop(0.35, c + '44');
  grad.addColorStop(1, c + '00');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
}

/* ---------- links: base line + shader pulse tube ---------- */
const linkGroups = {};
Object.keys(LAYERS).forEach(k => { linkGroups[k] = new THREE.Group(); scene.add(linkGroups[k]); });

const tubeMats = [];
const tubePickables = [];
const linkStates = []; // { def, curve, line, tubeMat, baseLineOpacity }

const tubeVert = `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
`;
const tubeFrag = `
  uniform vec3 uColor;
  uniform float uTime, uOffset, uDim, uBoost;
  varying vec2 vUv;
  void main() {
    float x = vUv.x;
    float pulse = 0.0;
    for (int i = 0; i < 2; i++) {
      float pos = fract(uTime * 0.11 + uOffset + float(i) * 0.5);
      pulse += smoothstep(0.09, 0.0, abs(x - pos));
    }
    float a = (0.06 + pulse * 0.85) * uDim;
    gl_FragColor = vec4(uColor * uBoost, a);
  }
`;

function makeLink(def) {
  const A = nodeById[def.a], B = nodeById[def.b];
  if (!A || !B) return;
  const pa = A.group.position, pb = B.group.position;
  const mid = pa.clone().add(pb).multiplyScalar(0.5);
  const dist = pa.distanceTo(pb);
  mid.y += Math.min(2.2 + dist * 0.16, 7.5);
  const curve = new THREE.QuadraticBezierCurve3(pa.clone(), mid, pb.clone());

  const layerCfg = LAYERS[def.layer];
  const pts = curve.getPoints(60);
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geo, def.dashed
    ? new THREE.LineDashedMaterial({ color: layerCfg.color, transparent: true, opacity: 0.34, dashSize: 0.5, gapSize: 0.35 })
    : new THREE.LineBasicMaterial({ color: layerCfg.color, transparent: true, opacity: 0.42 }));
  if (def.dashed) line.computeLineDistances();
  linkGroups[def.layer].add(line);

  // glow pulse tube (replaces old flow particles)
  const tubeMat = new THREE.ShaderMaterial({
    vertexShader: tubeVert, fragmentShader: tubeFrag,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uColor: { value: new THREE.Color(layerCfg.color) },
      uTime: { value: 0 },
      uOffset: { value: Math.random() },
      uDim: { value: 1 },
      uBoost: { value: 1 },
    },
  });
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.045, 5, false), tubeMat);
  tube.userData.linkDef = def;
  linkGroups[def.layer].add(tube);
  tubeMats.push(tubeMat);
  tubePickables.push(tube);

  linkStates.push({ def, curve, line, tubeMat, baseLineOpacity: line.material.opacity });
}

/* ---------- data packets (1 draw call per layer) ---------- */
const packetSystems = {};
{
  const speeds = { network: 0.045, data: 0.075, monitoring: 0.05, dns: 0.038 };
  const sizes  = { network: 0.36, data: 0.46, monitoring: 0.34, dns: 0.34 };
  for (const layer of Object.keys(LAYERS)) {
    const links = linkStates.filter(ls => ls.def.layer === layer);
    if (!links.length) continue;
    const counts = links.map(() => layer === 'data' ? 3 : 2);
    const total = counts.reduce((a, b) => a + b, 0);
    const aCtrl = new Float32Array(total * 3);
    const aEnd  = new Float32Array(total * 3);
    const aOffset = new Float32Array(total);
    const aDim = new Float32Array(total).fill(1);
    const pos = new Float32Array(total * 3);
    let k = 0;
    links.forEach((ls, li) => {
      const c = ls.curve, n = counts[li];
      ls.packetRange = [k, n];
      for (let j = 0; j < n; j++) {
        pos.set([c.v0.x, c.v0.y, c.v0.z], k * 3);
        aCtrl.set([c.v1.x, c.v1.y, c.v1.z], k * 3);
        aEnd.set([c.v2.x, c.v2.y, c.v2.z], k * 3);
        aOffset[k] = (j + 0.5) / n;
        k++;
      }
    });
    const g = new THREE.BufferGeometry();
    const attrDim = new THREE.BufferAttribute(aDim, 1);
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aCtrl', new THREE.BufferAttribute(aCtrl, 3));
    g.setAttribute('aEnd', new THREE.BufferAttribute(aEnd, 3));
    g.setAttribute('aOffset', new THREE.BufferAttribute(aOffset, 1));
    g.setAttribute('aDim', attrDim);
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: {
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(LAYERS[layer].color) },
        uSpeed: { value: speeds[layer] },
        uSize: { value: sizes[layer] },
        uAlpha: { value: 0 },
      },
      vertexShader: `
        attribute vec3 aCtrl, aEnd; attribute float aOffset, aDim;
        uniform float uTime, uSpeed, uSize;
        varying float vA;
        void main(){
          float t = fract(uTime * uSpeed + aOffset);
          vec3 p = (1.0 - t) * (1.0 - t) * position + 2.0 * (1.0 - t) * t * aCtrl + t * t * aEnd;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = clamp(uSize * (320.0 / -mv.z), 1.0, 22.0);
          vA = smoothstep(0.0, 0.06, t) * (1.0 - smoothstep(0.93, 1.0, t)) * aDim;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        uniform vec3 uColor; uniform float uAlpha;
        varying float vA;
        void main(){
          float d = length(gl_PointCoord - 0.5);
          float a = (1.0 - smoothstep(0.06, 0.5, d)) * vA * uAlpha;
          if (a < 0.01) discard;
          gl_FragColor = vec4(uColor, a);
        }`,
    });
    const points = new THREE.Points(g, mat);
    points.frustumCulled = false;
    linkGroups[layer].add(points);
    packetSystems[layer] = { points, mat, attrDim, aDim };
  }
}

}

function pick(ev) {
  mouse.x = (ev.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(ev.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hitsN = raycaster.intersectObjects(pickables, false);
  if (hitsN.length) return { node: nodeById[hitsN[0].object.userData.nodeDef.id], tube: null };
  const hitsT = raycaster.intersectObjects(tubePickables, false);
  if (hitsT.length) return { node: null, tube: hitsT[0].object };
  return { node: null, tube: null };
}

function updatePacketDims(set) {
  for (const ls of linkStates) {
    if (!ls.packetRange) continue;
    const sys = packetSystems[ls.def.layer];
    if (!sys) continue;
    const involved = !set || (set.has(ls.def.a) || set.has(ls.def.b));
    const v = involved ? 1 : 0.08;
    const [start, n] = ls.packetRange;
    for (let i = 0; i < n; i++) sys.aDim[start + i] = v;
    sys.attrDim.needsUpdate = true;
  }
}

function applyFocus(set) {
  lastFocusSet = set;
  for (const id in nodeById) {
    const n = nodeById[id];
    const dimmed = set && !set.has(id);
    n.mesh.material.opacity = dimmed ? 0.22 : (n.def.cat === 'net' ? 0.85 : 1);
    n.halo.material.opacity = dimmed ? 0.12 : 1;
    n.label.fillOpacity = dimmed ? 0.1 : 1;
    if (n.edge) n.edge.material.opacity = dimmed ? 0.12 : n.baseEdgeOpacity;
    if (!set || !dimmed) n.mesh.material.emissiveIntensity = id === selected?.def.id ? 0.85 : n.baseEmissive;
    else n.mesh.material.emissiveIntensity = 0.02;
  }
  for (const ls of linkStates) {
    const involved = set && (set.has(ls.def.a) || set.has(ls.def.b));
    ls.line.material.opacity = !set ? ls.baseLineOpacity : involved ? 0.9 : 0.04;
    ls.tubeMat.uniforms.uDim.value = !set ? 1 : involved ? 1.5 : 0.05;
  }
  updatePacketDims(set);
}

function setFocusSource(src) {
  focusSource = src;
  if (src !== 'search') document.getElementById('search').value = '';
  if (src !== 'legend') Object.values(legendItems).forEach(x => x.classList.remove('active'));
}

function flyToNode(node) {
  const p = node.group.position.clone();
  const dir = camera.position.clone().sub(p).normalize();
  const camPos = p.clone().add(dir.multiplyScalar(9)).add(new THREE.Vector3(0, 1.6, 0));
  const tgt = p.clone().add(new THREE.Vector3(0, 0.8, 0));
  flyTo(camPos, tgt, 1.4);
}

function select(node, opts = {}) {
  if (!node) return;
  if (tourActive && !opts.tour) stopTour();
  if (selected && selected !== node) setEmissive(selected, false);
  selected = node;
  controls.autoRotate = false;
  clearTimeout(idleTimer);
  setEmissive(node, true);
  const set = new Set([node.def.id, ...adjacency[node.def.id]]);
  setFocusSource('node');
  applyFocus(set);
  flyToNode(node);
  document.getElementById('info-name').textContent = node.def.label;
  document.getElementById('info-cat').textContent =
    CATEGORIES[node.def.cat].label + (node.def.site ? ` · site ${node.def.site}` : '');
  document.getElementById('info-desc').textContent = node.def.desc;
  document.getElementById('info-tags').innerHTML =
    (node.def.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  infoEl.classList.add('open');
  try { history.replaceState(null, '', '#' + node.def.id); } catch {}
}

function deselect() {
  clearSelection();
  setFocusSource(null);
  applyFocus(null);
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!selected) controls.autoRotate = true; }, 5000);
}

function clearSelection() {
  if (selected) setEmissive(selected, false);
  selected = null;
  infoEl.classList.remove('open');
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
}

// click vs drag discrimination
let downPos = null;
renderer.domElement.addEventListener('pointerdown', ev => {
  downPos = [ev.clientX, ev.clientY];
  stopTour();
});

renderer.domElement.addEventListener('pointermove', ev => {
  const { node, tube } = pick(ev);
  if (hoveredNode && hoveredNode !== node && hoveredNode !== selected) {
    const dim = lastFocusSet && !lastFocusSet.has(hoveredNode.def.id);
    hoveredNode.mesh.material.emissiveIntensity = dim ? 0.02 : hoveredNode.baseEmissive;
  }
  hoveredNode = node;
  if (hoveredNode && hoveredNode !== selected) setEmissive(hoveredNode, true);

  if (hoveredTube && hoveredTube !== tube) hoveredTube.material.uniforms.uBoost.value = 1;
  hoveredTube = tube;
  if (hoveredTube) hoveredTube.material.uniforms.uBoost.value = 2.4;

  renderer.domElement.style.cursor = (hoveredNode || hoveredTube) ? 'pointer' : 'default';

  // tooltip
  if (node) {
    tipEl.innerHTML = `<b>${node.def.label}</b><div class="t2">${CATEGORIES[node.def.cat].label}</div>`;
  } else if (tube) {
    const d = tube.userData.linkDef;
    const A = nodeById[d.a], B = nodeById[d.b];
    tipEl.innerHTML = `<b>${A.def.label} → ${B.def.label}</b><div class="t2">${LAYERS[d.layer].label}${d.label ? ' · ' + d.label : ''}</div>`;
  } else {
    tipEl.style.display = 'none';
    return;
  }
  tipEl.style.display = 'block';
  tipEl.style.left = Math.min(ev.clientX + 16, window.innerWidth - tipEl.offsetWidth - 10) + 'px';
  tipEl.style.top  = Math.min(ev.clientY + 16, window.innerHeight - tipEl.offsetHeight - 10) + 'px';
});

renderer.domElement.addEventListener('pointerleave', () => { tipEl.style.display = 'none'; });

renderer.domElement.addEventListener('click', ev => {
  if (downPos && Math.hypot(ev.clientX - downPos[0], ev.clientY - downPos[1]) > 5) return; // was a drag
  const { node } = pick(ev);
  if (node) select(node);
  else deselect();
});

/* ---------- search ---------- */
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
const searchEl = document.getElementById('search');
searchEl.addEventListener('input', () => {
  const q = norm(searchEl.value.trim());
  if (q.length < 2) { setFocusSource(null); applyFocus(null); return; }
  const ids = new Set(NODES.filter(n =>
    norm(n.label).includes(q) ||
    (n.tags || []).some(t => norm(t).includes(q)) ||
    norm(n.desc || '').includes(q)
  ).map(n => n.id));
  if (selected && !ids.has(selected.def.id)) clearSelection();
  setFocusSource('search');
  applyFocus(ids.size ? ids : new Set(['__none__']));
});
searchEl.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') {
    const q = norm(searchEl.value.trim());
    if (q.length < 2) return;
    const hit = NODES.find(n =>
      norm(n.label).includes(q) ||
      (n.tags || []).some(t => norm(t).includes(q)) ||
      norm(n.desc || '').includes(q));
    if (hit) select(nodeById[hit.id]);
  } else if (ev.key === 'Escape') {
    searchEl.value = '';
    setFocusSource(null);
    applyFocus(null);
    searchEl.blur();
  }
});

/* ---------- auto-tour ---------- */
const TOUR = ['workstation', 'tailnet', 'openwebui', 'n8n', 'qdrant', 'redmine', 'dsh', 'worker', 'haB', 'grafana', 'piholeA', 'searxng'];
let tourActive = false, tourIdx = 0, tourTimer = null;
const tourBtn = document.getElementById('tour');
function tourStep() {
  const id = TOUR[tourIdx % TOUR.length];
  tourIdx++;
  select(nodeById[id], { tour: true });
}
function startTour() {
  tourActive = true;
  tourBtn.classList.add('on');
  tourBtn.textContent = '■ stop tour';
  tourIdx = 0;
  tourStep();
  tourTimer = setInterval(tourStep, 6500);
}
function stopTour() {
  if (!tourActive) return;
  tourActive = false;
  clearInterval(tourTimer);
  tourTimer = null;
  tourBtn.classList.remove('on');
  tourBtn.textContent = '▶ auto-tour';
}
tourBtn.addEventListener('click', () => tourActive ? stopTour() : startTour());

/* ---------- keyboard ---------- */
window.addEventListener('keydown', ev => {
  if (ev.target === searchEl && ev.key !== 'Escape') return;
  if (ev.key === '/') { ev.preventDefault(); searchEl.focus(); }
  else if (ev.key === 'Escape') { stopTour(); deselect(); }
  else if (ev.key === 'r' || ev.key === 'R') { stopTour(); flyTo(HOME_CAM, HOME_TGT, 1.2); }
  else if (ev.key === 't' || ev.key === 'T') { tourActive ? stopTour() : startTour(); }
  else if (['1', '2', '3', '4'].includes(ev.key)) {
    const key = Object.keys(LAYERS)[Number(ev.key) - 1];
    const input = layerInputs[key];
    if (input) { input.checked = !input.checked; input.dispatchEvent(new Event('change')); }
  }
});

/* ---------- copy view link ---------- */
document.getElementById('copy-link').addEventListener('click', async () => {
  const btn = document.getElementById('copy-link');
  try {
    await navigator.clipboard.writeText(location.href);
    btn.textContent = '✓ copied';
  } catch {
    btn.textContent = '✗ clipboard blocked';
  }
  setTimeout(() => { btn.textContent = '⧉ copy view link'; }, 1600);
});

/* ---------- post-processing ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.55, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// grade: vignette + film grain (LDR, after tone mapping)
const GradeShader = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uVignette: { value: 1.1 }, uGrain: { value: 0.05 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime, uVignette, uGrain;
    varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7)) + mod(uTime, 10.0) * 13.0) * 43758.5453); }
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 d = vUv - 0.5;
      float v = smoothstep(0.95, 0.35, dot(d, d) * uVignette * 2.0);
      c.rgb *= mix(0.72, 1.0, v);
      c.rgb += (hash(vUv * vec2(1920.0, 1080.0)) - 0.5) * uGrain * 0.35;
      gl_FragColor = c;
    }
  `,
};
const gradePass = new ShaderPass(GradeShader);
composer.addPass(gradePass);

const smaaPass = new SMAAPass(window.innerWidth * renderer.getPixelRatio(), window.innerHeight * renderer.getPixelRatio());
composer.addPass(smaaPass);

/* ---------- resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  if (reflectorRef) reflectorRef.getRenderTarget().setSize(
    Math.floor(window.innerWidth * 0.5), Math.floor(window.innerHeight * 0.5));
});

/* ---------- animate ---------- */
const clock = new THREE.Clock();
let fpsEMA = 60;
let introT = 0;
let introDone = false;
let linkFadeApplied = false;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  fpsEMA += (1 / Math.max(dt, 1e-4) - fpsEMA) * 0.05;

  if (!introDone) {
    introT += dt;
    if (introT > 5.5) introDone = true;
  }

  // camera animation
  if (camAnim) {
    camAnim.t += dt / camAnim.dur;
    const k = easeInOutCubic(Math.min(camAnim.t, 1));
    camera.position.lerpVectors(camAnim.fromP, camAnim.toP, k);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, k);
    camera.lookAt(controls.target);
    if (camAnim.t >= 1) {
      const done = camAnim.done;
      camAnim = null;
      controls.enabled = true;
      if (done) done();
    }
  } else {
    controls.update();
  }

  // power-on intro: nodes pop in, links + packets fade in
  for (const id in nodeById) {
    const n = nodeById[id];
    const delay = n.group.userData.introDelay;
    const k = clamp01((introT - delay) / 0.7);
    const pop = k < 1 ? Math.max(easeOutBack(k), 0) : 1;
    const hoverScale = selected === n ? 1.14 : (hoveredNode === n ? 1.07 : 1);
    const target = pop * hoverScale;
    const sk = 1 - Math.exp(-8 * dt);
    n.group.scale.x += (target - n.group.scale.x) * sk;
    n.group.scale.y = n.group.scale.z = n.group.scale.x;
    const phase = id.length * 1.37;
    n.group.position.y = n.baseY + Math.sin(t * 0.9 + phase) * 0.09;
    const s = (n.def.cat === 'net' ? 3.0 : 2.5) * (1 + Math.sin(t * 1.6 + phase) * 0.07);
    n.halo.scale.setScalar(s);
  }

  // link + packet intro fade
  const linkFade = clamp01((introT - 1.6) / 1.2);
  for (const key in packetSystems) packetSystems[key].mat.uniforms.uAlpha.value = linkFade;
  for (const m of tubeMats) m.uniforms.uTime.value = t;
  if (linkFade < 1) {
    for (const ls of linkStates) ls.line.material.opacity = ls.baseLineOpacity * linkFade;
  } else if (!linkFadeApplied) {
    linkFadeApplied = true;
    applyFocus(lastFocusSet);
  }

  // scan floor + pedestals + platform pulse
  scanMat.uniforms.uTime.value = t;
  for (const r of pedestalRings) {
    r.mesh.rotation.z = t * r.speed + r.phase;
    r.mesh.material.opacity = 0.16 + 0.10 * Math.sin(t * 1.4 + r.phase);
  }
  for (let i = 0; i < platformEdges.length; i++) {
    platformEdges[i].material.opacity = 0.55 + 0.25 * Math.sin(t * 1.1 + i * 2.1);
  }

  for (const key in packetSystems) packetSystems[key].mat.uniforms.uTime.value = t;
  gradePass.uniforms.uTime.value = t;

  composer.render();
}

animate();
window.__infraDebug = {
  nodeById, camera, controls, THREE, linkGroups, linkStates, tubeMats, packetSystems,
  get fps() { return fpsEMA; },
};
document.getElementById('loader').classList.add('done');

// cinematic intro -> then honour deep link (#node)
flyTo(HOME_CAM, HOME_TGT, 3.2, () => {
  const hash = location.hash.replace('#', '');
  if (hash && nodeById[hash]) { select(nodeById[hash]); return; }
  controls.autoRotate = true;
});
</script>
</body>
</html>
