  #title p { font-size: 11px; color: var(--dim); margin-top: 4px; letter-spacing: 0.05em; }

  #legend { top: 18px; right: 22px; background: var(--panel); border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(8px); min-width: 168px; }

  .lg-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; box-shadow: 0 0 6px currentColor; }

  #layers { bottom: 20px; left: 22px; background: var(--panel); border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(8px); }
  #layers h2 { font-size: 10px; letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; }
  #layers label { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 3px 0; cursor: pointer; user-select: none; }
  #layers input { accent-color: var(--accent); }
  #layers .hint { margin-top: 8px; font-size: 10px; color: var(--dim); }

  #info { bottom: 20px; right: 22px; width: 300px; background: var(--panel); border: 1px solid var(--border);
          border-radius: 10px; padding: 14px 16px; backdrop-filter: blur(8px); display: none; }
  #info.open { display: block; }
  #info h3 { font-size: 13px; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 2px; }
  #info .cat { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 8px; }

  #info .close { position: absolute; top: 8px; right: 12px; cursor: pointer; color: var(--dim); font-size: 14px; background: none; border: none; }
  #info .close:hover { color: var(--text); }

  #help { bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--dim); letter-spacing: 0.08em; }

  #loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: var(--bg); z-index: 100; transition: opacity 0.6s; font-size: 12px; color: var(--dim); letter-spacing: 0.2em; }
  #loader.done { opacity: 0; pointer-events: none; }

/* ---------- site platforms ---------- */
function makePlatform(cx, cz, w, d, color, label) {
  const geo = new THREE.BoxGeometry(w, 0.35, d);
  const mat = new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.16, roughness: 0.4, metalness: 0.6 });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(cx, 0.05, cz);
  scene.add(m);
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.75 })
  );
  edges.position.copy(m.position);
  scene.add(edges);
  const sprite = makeTextSprite(label, { size: 44, color: '#aebadb', pad: 22 });
  sprite.position.set(cx, 0.65, cz + d / 2 + 1.1);
  sprite.scale.multiplyScalar(1.35);
  scene.add(sprite);
}

/* ---------- labels ---------- */
function makeTextSprite(text, { size = 40, color = '#e8eefc', pad = 18 } = {}) {
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  ctx.font = `600 ${size}px "SF Mono", Menlo, Consolas, monospace`;
  const w = Math.ceil(ctx.measureText(text).width) + pad * 2;
  cv.width = w; cv.height = size + pad * 2;
  const c2 = cv.getContext('2d');
  c2.font = `600 ${size}px "SF Mono", Menlo, Consolas, monospace`;
  c2.textBaseline = 'middle'; c2.textAlign = 'center';
  c2.shadowColor = 'rgba(0,0,0,0.9)'; c2.shadowBlur = 10;
  c2.fillStyle = color;
  c2.fillText(text, w / 2, cv.height / 2);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.scale.set(cv.width / 78, cv.height / 78, 1);
  return sp;
}

/* ---------- nodes ---------- */
const nodeById = {};
const pickables = [];

function makeNode(def) {
  const cat = CATEGORIES[def.cat];
  const group = new THREE.Group();

  const isOverlay = def.cat === 'net';
  const geo = isOverlay
    ? new THREE.IcosahedronGeometry(0.65, 1)
    : new THREE.BoxGeometry(1.35, 1.35, 1.35);

  const mat = new THREE.MeshStandardMaterial({
    color: cat.color, roughness: 0.32, metalness: 0.55,
    emissive: cat.color, emissiveIntensity: isOverlay ? 0.35 : 0.18,
    transparent: isOverlay, opacity: isOverlay ? 0.85 : 1,
    wireframe: isOverlay,
  });
  const mesh = new THREE.Mesh(geo, mat);
  group.add(mesh);

  if (!isOverlay) {
    const edge = new THREE.LineSegments(
      new THREE.EdgesGeometry(geo),
      new THREE.LineBasicMaterial({ color: cat.color, transparent: true, opacity: 0.9 })
    );
    edge.scale.setScalar(1.002);
    group.add(edge);
  }

  // glow halo
  const halo = makeGlowSprite(cat.color);
  halo.scale.setScalar(isOverlay ? 3.0 : 2.5);
  group.add(halo);

  const label = makeTextSprite(def.label, { color: def.cat === 'client' ? '#ffffff' : '#cfe0ff' });
  label.position.y = isOverlay ? 1.7 : 1.45;
  group.add(label);

  group.position.fromArray(def.pos);
  scene.add(group);

  mesh.userData.nodeDef = def;
  pickables.push(mesh);
  nodeById[def.id] = { def, group, mesh, baseY: def.pos[1], halo };
  return nodeById[def.id];
}

function makeGlowSprite(color) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const ctx = cv.getContext('2d');
  const grad = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
  const c = '#' + color.toString(16).padStart(6, '0');
  grad.addColorStop(0, c + 'aa');
  grad.addColorStop(0.35, c + '44');
  grad.addColorStop(1, c + '00');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
}

NODES.forEach(makeNode);

  const A = nodeById[def.a], B = nodeById[def.b];
  if (!A || !B) return;
  const pa = A.group.position, pb = B.group.position;
  const mid = pa.clone().add(pb).multiplyScalar(0.5);
  const dist = pa.distanceTo(pb);
  mid.y += Math.min(2.2 + dist * 0.16, 7.5);
  const curve = new THREE.QuadraticBezierCurve3(pa.clone(), mid, pb.clone());

  const layerCfg = LAYERS[def.layer];
  const pts = curve.getPoints(60);
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geo, def.dashed
    ? new THREE.LineDashedMaterial({ color: layerCfg.color, transparent: true, opacity: 0.34, dashSize: 0.5, gapSize: 0.35 })
    : new THREE.LineBasicMaterial({ color: layerCfg.color, transparent: true, opacity: 0.5 }));
  if (def.dashed) line.computeLineDistances();
  linkGroups[def.layer].add(line);

  if (def.label) {
    const sp = makeTextSprite(def.label, { size: 30, color: '#8fa3cc' });
    sp.position.copy(curve.getPoint(0.5)).y += 0.55;
    sp.scale.multiplyScalar(0.8);
    linkGroups[def.layer].add(sp);
  }

  // flow particles
  const COUNT = 3;
  const pgeo = new THREE.BufferGeometry();
  pgeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(COUNT * 3), 3));
  const pts2 = new THREE.Points(pgeo, new THREE.PointsMaterial({
    color: layerCfg.color, size: 0.32, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  linkGroups[def.layer].add(pts2);
  const speeds = Array.from({ length: COUNT }, (_, i) => ({ t: i / COUNT, v: 0.10 + Math.random() * 0.08 }));
  flows.push({ curve, geo: pgeo, speeds, layer: def.layer });
}

LINKS.forEach(makeLink);

/* ---------- legend + layer toggles ---------- */
const legend = document.getElementById('legend');
Object.values(CATEGORIES).forEach(c => {
  const el = document.createElement('div');
  el.className = 'lg-item';
  el.innerHTML = `<span class="lg-dot" style="background:#${c.color.toString(16).padStart(6,'0')};color:#${c.color.toString(16).padStart(6,'0')}"></span>${c.label}`;
  legend.appendChild(el);
});

const toggles = document.getElementById('layer-toggles');
Object.entries(LAYERS).forEach(([key, cfg]) => {
  const label = document.createElement('label');
  label.innerHTML = `<input type="checkbox" checked data-layer="${key}"> ${cfg.label}`;
  label.querySelector('input').addEventListener('change', e => {
    linkGroups[key].visible = e.target.checked;
  });
  toggles.appendChild(label);
});

/* ---------- picking / info panel ---------- */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hovered = null;
let selected = null;

const infoEl = document.getElementById('info');
document.getElementById('info-close').addEventListener('click', () => {
  infoEl.classList.remove('open');
  if (selected) { setEmissive(selected, false); selected = null; }
});

function setEmissive(node, on) {
  node.mesh.material.emissiveIntensity = on ? 0.85 : (node.def.cat === 'net' ? 0.35 : 0.18);
}

function pick(ev) {
  mouse.x = (ev.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(ev.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  return hits.length ? nodeById[hits[0].object.userData.nodeDef.id] : null;
}

renderer.domElement.addEventListener('pointermove', ev => {
  const n = pick(ev);
  if (hovered && hovered !== n && hovered !== selected) setEmissive(hovered, false);
  hovered = n;
  if (hovered && hovered !== selected) setEmissive(hovered, true);
  renderer.domElement.style.cursor = hovered ? 'pointer' : 'default';
});

renderer.domElement.addEventListener('click', ev => {
  const n = pick(ev);
  if (selected && selected !== n) setEmissive(selected, false);
  selected = n;
  if (!n) { infoEl.classList.remove('open'); return; }
  setEmissive(n, true);
  document.getElementById('info-name').textContent = n.def.label;
  document.getElementById('info-cat').textContent =
    CATEGORIES[n.def.cat].label + (n.def.site ? ` · site ${n.def.site}` : '');
  document.getElementById('info-desc').textContent = n.def.desc;
  document.getElementById('info-tags').innerHTML =
    (n.def.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  infoEl.classList.add('open');
});

/* ---------- post-processing ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.65, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- animate ---------- */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // gentle node float + halo pulse
  for (const id in nodeById) {
    const n = nodeById[id];
    const phase = id.length * 1.37;
    n.group.position.y = n.baseY + Math.sin(t * 0.9 + phase) * 0.09;
    const s = (n.def.cat === 'net' ? 3.0 : 2.5) * (1 + Math.sin(t * 1.6 + phase) * 0.07);
    n.halo.scale.setScalar(s);
  }

  // flow particles (respect layer visibility)
  for (const f of flows) {
    const visible = linkGroups[f.layer].visible;
    const attr = f.geo.attributes.position;
    for (let i = 0; i < f.speeds.length; i++) {
      const p = f.speeds[i];
      p.t = (p.t + p.v * dt) % 1;
      const v = f.curve.getPoint(p.t);
      attr.setXYZ(i, visible ? v.x : 0, visible ? v.y : -999, visible ? v.z : 0);
    }
    attr.needsUpdate = true;
  }

  controls.update();
  composer.render();
}

animate();
window.__infraDebug = { nodeById, camera, controls, THREE, flows, linkGroups };
document.getElementById('loader').classList.add('done');
</script>
</body>
