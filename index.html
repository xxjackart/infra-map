  #title h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text); }
  #title p { font-size: 11px; color: var(--dim); margin-top: 4px; letter-spacing: 0.05em; }

            border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(8px); min-width: 168px; }

  #layers { bottom: 20px; left: 22px; background: var(--panel); border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(8px); }
  #layers h2 { font-size: 10px; letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; }
  #layers label { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 3px 0; cursor: pointer; user-select: none; }
  #layers input { accent-color: var(--accent); }
  #layers .hint { margin-top: 8px; font-size: 10px; color: var(--dim); }

  #info { bottom: 20px; right: 22px; width: 300px; background: var(--panel); border: 1px solid var(--border);
          border-radius: 10px; padding: 14px 16px; backdrop-filter: blur(8px); display: none; }
  #info.open { display: block; }
  #info h3 { font-size: 13px; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 2px; }
  #info .cat { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 8px; }

  #info .close { position: absolute; top: 8px; right: 12px; cursor: pointer; color: var(--dim); font-size: 14px; background: none; border: none; }
  #info .close:hover { color: var(--text); }

  #help { bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--dim); letter-spacing: 0.08em; }

  #loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;

  sprite.position.set(cx, 0.65, cz + d / 2 + 1.1);
  scene.add(sprite);

function injectFresnel(mat, colorHex, strength) {
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uRimColor = { value: new THREE.Color(colorHex) };
    shader.uniforms.uRimPower = { value: 2.4 };
    shader.uniforms.uRimStrength = { value: strength };
    shader.fragmentShader = shader.fragmentShader
      .replace('void main() {', 'uniform vec3 uRimColor;\nuniform float uRimPower;\nuniform float uRimStrength;\nvoid main() {')
      .replace('#include <emissivemap_fragment>',
        '#include <emissivemap_fragment>\n' +
        '  float rimF = pow(1.0 - saturate(dot(normalize(vNormal), normalize(vViewPosition))), uRimPower);\n' +
        '  totalEmissiveRadiance += uRimColor * rimF * uRimStrength;\n');
  };
  mat.customProgramCacheKey = () => 'fresnel-rim';
}

  const cat = CATEGORIES[def.cat];
  const group = new THREE.Group();

  const isOverlay = def.cat === 'net';
  const geo = isOverlay
    ? new THREE.IcosahedronGeometry(0.65, 1)
    : new THREE.BoxGeometry(1.35, 1.35, 1.35);

  const mat = new THREE.MeshStandardMaterial({
    color: cat.color, roughness: 0.32, metalness: 0.55,
    emissive: cat.color, emissiveIntensity: isOverlay ? 0.35 : 0.18,
    transparent: true, opacity: isOverlay ? 0.85 : 1,
    wireframe: isOverlay,
  });
  if (!isOverlay) injectFresnel(mat, cat.color, 0.85);
  const mesh = new THREE.Mesh(geo, mat);
  group.add(mesh);

  let edge = null;
  if (!isOverlay) {
    edge = new THREE.LineSegments(
      new THREE.EdgesGeometry(geo),
      new THREE.LineBasicMaterial({ color: cat.color, transparent: true, opacity: 0.9 })
    );
    edge.scale.setScalar(1.002);
    group.add(edge);
  }

  // glow halo
  const halo = makeGlowSprite(cat.color);
  halo.scale.setScalar(isOverlay ? 3.0 : 2.5);
  group.add(halo);

  const label = makeLabel(def.label, { color: def.cat === 'client' ? '#ffffff' : '#cfe0ff' });
  label.position.y = isOverlay ? 1.7 : 1.45;
  group.add(label);

  group.position.fromArray(def.pos);
  scene.add(group);

  mesh.userData.nodeDef = def;
  pickables.push(mesh);
  nodeById[def.id] = {
    def, group, mesh, edge, halo, label,
    baseY: def.pos[1],
    baseEmissive: isOverlay ? 0.35 : 0.18,
  };
  return nodeById[def.id];
}

function makeGlowSprite(color) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const ctx = cv.getContext('2d');
  const grad = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
  const c = '#' + color.toString(16).padStart(6, '0');
  grad.addColorStop(0, c + 'aa');
  grad.addColorStop(0.35, c + '44');
  grad.addColorStop(1, c + '00');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
}

NODES.forEach(makeNode);

/* ---------- links: base line + shader pulse tube ---------- */
const linkGroups = {};
Object.keys(LAYERS).forEach(k => { linkGroups[k] = new THREE.Group(); scene.add(linkGroups[k]); });

const tubeMats = [];
const tubePickables = [];
const linkStates = []; // { def, line, tubeMat, label }

const tubeVert = `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
`;
const tubeFrag = `
  uniform vec3 uColor;
  uniform float uTime, uOffset, uDim, uBoost;
  varying vec2 vUv;
  void main() {
    float x = vUv.x;
    float pulse = 0.0;
    for (int i = 0; i < 2; i++) {
      float pos = fract(uTime * 0.11 + uOffset + float(i) * 0.5);
      pulse += smoothstep(0.09, 0.0, abs(x - pos));
    }
    float a = (0.06 + pulse * 0.85) * uDim;
    gl_FragColor = vec4(uColor * uBoost, a);
  }
`;

function makeLink(def) {
  const A = nodeById[def.a], B = nodeById[def.b];
  if (!A || !B) return;
  const pa = A.group.position, pb = B.group.position;
  const mid = pa.clone().add(pb).multiplyScalar(0.5);
  const dist = pa.distanceTo(pb);
  mid.y += Math.min(2.2 + dist * 0.16, 7.5);
  const curve = new THREE.QuadraticBezierCurve3(pa.clone(), mid, pb.clone());

  const layerCfg = LAYERS[def.layer];
  const pts = curve.getPoints(60);
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geo, def.dashed
    ? new THREE.LineDashedMaterial({ color: layerCfg.color, transparent: true, opacity: 0.34, dashSize: 0.5, gapSize: 0.35 })
    : new THREE.LineBasicMaterial({ color: layerCfg.color, transparent: true, opacity: 0.42 }));
  if (def.dashed) line.computeLineDistances();
  linkGroups[def.layer].add(line);

  // glow pulse tube (replaces old flow particles)
  const tubeMat = new THREE.ShaderMaterial({
    vertexShader: tubeVert, fragmentShader: tubeFrag,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uColor: { value: new THREE.Color(layerCfg.color) },
      uTime: { value: 0 },
      uOffset: { value: Math.random() },
      uDim: { value: 1 },
      uBoost: { value: 1 },
    },
  });
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.045, 5, false), tubeMat);
  tube.userData.linkDef = def;
  linkGroups[def.layer].add(tube);
  tubeMats.push(tubeMat);
  tubePickables.push(tube);

  let label = null;
  if (def.label) {
    label = makeLabel(def.label, { size: 0.26, color: '#8fa3cc' });
    label.position.copy(curve.getPoint(0.5));
    label.position.y += 0.55;
    linkGroups[def.layer].add(label);
  }

  linkStates.push({ def, line, tubeMat, label, baseLineOpacity: line.material.opacity });
}

LINKS.forEach(makeLink);

// adjacency for focus dimming
const adjacency = {};
NODES.forEach(n => { adjacency[n.id] = new Set(); });
LINKS.forEach(l => { if (adjacency[l.a]) adjacency[l.a].add(l.b); if (adjacency[l.b]) adjacency[l.b].add(l.a); });

/* ---------- legend + layer toggles ---------- */
const legend = document.getElementById('legend');
Object.values(CATEGORIES).forEach(c => {
  const el = document.createElement('div');
  el.className = 'lg-item';
  el.innerHTML = `<span class="lg-dot" style="background:#${c.color.toString(16).padStart(6,'0')};color:#${c.color.toString(16).padStart(6,'0')}"></span>${c.label}`;
  legend.appendChild(el);
});

const toggles = document.getElementById('layer-toggles');
Object.entries(LAYERS).forEach(([key, cfg]) => {
  const label = document.createElement('label');
  label.innerHTML = `<input type="checkbox" checked data-layer="${key}"> ${cfg.label}`;
  label.querySelector('input').addEventListener('change', e => {
    linkGroups[key].visible = e.target.checked;
  });
  toggles.appendChild(label);
});

/* ---------- picking / focus / info panel ---------- */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredNode = null;
let hoveredTube = null;
let selected = null;

const infoEl = document.getElementById('info');
document.getElementById('info-close').addEventListener('click', () => deselect());

function setEmissive(node, on) {
  node.mesh.material.emissiveIntensity = on ? 0.85 : node.baseEmissive;
}

function pick(ev) {
  mouse.x = (ev.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(ev.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hitsN = raycaster.intersectObjects(pickables, false);
  if (hitsN.length) return { node: nodeById[hitsN[0].object.userData.nodeDef.id], tube: null };
  const hitsT = raycaster.intersectObjects(tubePickables, false);
  if (hitsT.length) return { node: null, tube: hitsT[0].object };
  return { node: null, tube: null };
}

function applyFocus(selectedId) {
  const keep = selectedId ? adjacency[selectedId] : null;
  for (const id in nodeById) {
    const n = nodeById[id];
    const dimmed = keep && id !== selectedId && !keep.has(id);
    n.mesh.material.opacity = dimmed ? 0.22 : (n.def.cat === 'net' ? 0.85 : 1);
    n.halo.material.opacity = dimmed ? 0.12 : 1;
    n.label.fillOpacity = dimmed ? 0.1 : 1;
    if (n.edge) n.edge.material.opacity = dimmed ? 0.12 : 0.9;
    if (!keep || id === selectedId) n.mesh.material.emissiveIntensity = id === selectedId ? 0.85 : n.baseEmissive;
    else n.mesh.material.emissiveIntensity = dimmed ? 0.02 : n.baseEmissive;
  }
  for (const ls of linkStates) {
    const involved = keep && (ls.def.a === selectedId || ls.def.b === selectedId);
    ls.line.material.opacity = !keep ? ls.baseLineOpacity : involved ? 0.9 : 0.04;
    ls.tubeMat.uniforms.uDim.value = !keep ? 1 : involved ? 1.5 : 0.05;
    if (ls.label) ls.label.fillOpacity = !keep ? 1 : involved ? 1 : 0.05;
  }
}

function flyToNode(node) {
  const p = node.group.position.clone();
  const dir = camera.position.clone().sub(p).normalize();
  const camPos = p.clone().add(dir.multiplyScalar(8.5)).add(new THREE.Vector3(0, 1.6, 0));
  const tgt = p.clone().add(new THREE.Vector3(0, 0.8, 0));
  flyTo(camPos, tgt, 1.4);
}

function select(node) {
  if (selected && selected !== node) setEmissive(selected, false);
  selected = node;
  controls.autoRotate = false;
  clearTimeout(idleTimer);
  setEmissive(node, true);
  applyFocus(node.def.id);
  flyToNode(node);
  document.getElementById('info-name').textContent = node.def.label;
  document.getElementById('info-cat').textContent =
    CATEGORIES[node.def.cat].label + (node.def.site ? ` · site ${node.def.site}` : '');
  document.getElementById('info-desc').textContent = node.def.desc;
  document.getElementById('info-tags').innerHTML =
    (node.def.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  infoEl.classList.add('open');
}

function deselect() {
  if (selected) setEmissive(selected, false);
  selected = null;
  infoEl.classList.remove('open');
  applyFocus(null);
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!selected) controls.autoRotate = true; }, 5000);
}

// click vs drag discrimination
let downPos = null;
renderer.domElement.addEventListener('pointerdown', ev => { downPos = [ev.clientX, ev.clientY]; });

renderer.domElement.addEventListener('pointermove', ev => {
  const { node, tube } = pick(ev);
  if (hoveredNode && hoveredNode !== node && hoveredNode !== selected) setEmissive(hoveredNode, false);
  hoveredNode = node;
  if (hoveredNode && hoveredNode !== selected) setEmissive(hoveredNode, true);

  if (hoveredTube && hoveredTube !== tube) hoveredTube.material.uniforms.uBoost.value = 1;
  hoveredTube = tube;
  if (hoveredTube) hoveredTube.material.uniforms.uBoost.value = 2.4;

  renderer.domElement.style.cursor = (hoveredNode || hoveredTube) ? 'pointer' : 'default';
});

renderer.domElement.addEventListener('click', ev => {
  if (downPos && Math.hypot(ev.clientX - downPos[0], ev.clientY - downPos[1]) > 5) return; // was a drag
  const { node } = pick(ev);
  if (node) select(node);
  else deselect();
});

/* ---------- post-processing ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.6, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// grade: vignette + film grain (LDR, after tone mapping)
const GradeShader = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uVignette: { value: 1.1 }, uGrain: { value: 0.05 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime, uVignette, uGrain;
    varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7)) + mod(uTime, 10.0) * 13.0) * 43758.5453); }
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 d = vUv - 0.5;
      float v = smoothstep(0.95, 0.35, dot(d, d) * uVignette * 2.0);
      c.rgb *= mix(0.72, 1.0, v);
      c.rgb += (hash(vUv * vec2(1920.0, 1080.0)) - 0.5) * uGrain * 0.35;
      gl_FragColor = c;
    }
  `,
};
const gradePass = new ShaderPass(GradeShader);
composer.addPass(gradePass);

const smaaPass = new SMAAPass(window.innerWidth * renderer.getPixelRatio(), window.innerHeight * renderer.getPixelRatio());
composer.addPass(smaaPass);

/* ---------- resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- animate ---------- */
const clock = new THREE.Clock();
let fpsEMA = 60;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  fpsEMA += (1 / Math.max(dt, 1e-4) - fpsEMA) * 0.05;

  // camera animation
  if (camAnim) {
    camAnim.t += dt / camAnim.dur;
    const k = easeInOutCubic(Math.min(camAnim.t, 1));
    camera.position.lerpVectors(camAnim.fromP, camAnim.toP, k);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, k);
    camera.lookAt(controls.target);
    if (camAnim.t >= 1) {
      const done = camAnim.done;
      camAnim = null;
      controls.enabled = true;
      if (done) done();
    }
  } else {
    controls.update();
  }

  // gentle node float + halo pulse
  for (const id in nodeById) {
    const n = nodeById[id];
    const phase = id.length * 1.37;
    n.group.position.y = n.baseY + Math.sin(t * 0.9 + phase) * 0.09;
    const s = (n.def.cat === 'net' ? 3.0 : 2.5) * (1 + Math.sin(t * 1.6 + phase) * 0.07);
    n.halo.scale.setScalar(s);
  }

  // shader pulse time
  for (const m of tubeMats) m.uniforms.uTime.value = t;
  gradePass.uniforms.uTime.value = t;

  composer.render();
}

animate();
window.__infraDebug = {
  nodeById, camera, controls, THREE, linkGroups, linkStates, tubeMats,
  get fps() { return fpsEMA; },
};
document.getElementById('loader').classList.add('done');

// cinematic intro
flyTo(HOME_CAM, HOME_TGT, 2.6, () => { controls.autoRotate = true; });
</script>
</body>
</html>
