/* ============================================================

   ============================================================ */
const FONT_URL = 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/fonts/droid/droid_sans_mono_regular.typeface.json';
const SI_URL = slug => `https://cdn.jsdelivr.net/npm/simple-icons@15/icons/${slug}.svg`;

const fontPromise = new FontLoader().loadAsync(FONT_URL);

async function fetchIconSvg(slug) {
  try {
    const r = await fetch(SI_URL(slug));
    return r.ok ? await r.text() : null;
  } catch { return null; }
}

const SLUGS = [...new Set(NODES.map(n => n.icon).filter(s => s && s.length > 2))];
const iconSvgs = {};
await Promise.all(SLUGS.map(async s => { iconSvgs[s] = await fetchIconSvg(s); }));

const FONT = await fontPromise;

/* ---------- extruded logo geometry (cached per icon) ---------- */
function makeMonogramGeo(letters) {
  const geo = new TextGeometry(letters, {
    font: FONT, size: 0.95, depth: 0.55, curveSegments: 2,
    bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.035, bevelSegments: 1,
  });
  return [geo];
}

const geoCache = {};
function getIconGeos(icon) {
  if (geoCache[icon]) return geoCache[icon];
  let geos = null;
  let flipY = true;
  const svg = iconSvgs[icon];
  if (svg) {
    try {
      const data = new SVGLoader().parse(svg);
      geos = [];
      for (const path of data.paths) {
        for (const sh of path.toShapes(true)) {
          geos.push(new THREE.ExtrudeGeometry(sh, {
            depth: 0.55, bevelEnabled: true, curveSegments: 6,
            bevelThickness: 0.05, bevelSize: 0.035, bevelSegments: 1,
          }));
        }
      }
      if (!geos.length) geos = null;
    } catch { geos = null; }
  }
  if (!geos) { geos = makeMonogramGeo(icon); flipY = false; }

  // normalize: uniform scale to max dim 1.6, center at origin
  const min = new THREE.Vector3(Infinity, Infinity, Infinity);
  const max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
  for (const g of geos) { g.computeBoundingBox(); min.min(g.boundingBox.min); max.max(g.boundingBox.max); }
  const size = new THREE.Vector3().subVectors(max, min);
  const k = 1.6 / Math.max(size.x, size.y);
  for (const g of geos) g.scale(k, k, k);
  // scale depth independently to real 0.55 world units (SVG units would normalize depth away)
  min.set(Infinity, Infinity, Infinity); max.set(-Infinity, -Infinity, -Infinity);
  for (const g of geos) { g.computeBoundingBox(); min.min(g.boundingBox.min); max.max(g.boundingBox.max); }
  const zSpan = Math.max(max.z - min.z, 1e-6);
  const zK = 0.55 / zSpan;
  for (const g of geos) g.scale(1, 1, zK);
  min.set(Infinity, Infinity, Infinity); max.set(-Infinity, -Infinity, -Infinity);
  for (const g of geos) { g.computeBoundingBox(); min.min(g.boundingBox.min); max.max(g.boundingBox.max); }
  const c = new THREE.Vector3().addVectors(min, max).multiplyScalar(0.5);
  for (const g of geos) g.translate(-c.x, -c.y, -c.z);

  geoCache[icon] = { geos, flipY };
  return geoCache[icon];
}

function flyTo(camPos, tgtPos, dur, done) {
  camAnim = {
    t: 0, dur,
    fromP: camera.position.clone(), toP: camPos.clone(),
    fromT: controls.target.clone(), toT: tgtPos.clone(),
    done: done || null,
  };
  controls.enabled = false;
}
function cancelFly() {
  if (camAnim) { camAnim = null; controls.enabled = true; }
}
renderer.domElement.addEventListener('pointerdown', cancelFly);
const easeInOutCubic = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;

// pause auto-rotate while interacting, resume after idle
let idleTimer = null;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(idleTimer); });
controls.addEventListener('end', () => {
  clearTimeout(idleTimer);
  if (!selected) idleTimer = setTimeout(() => controls.autoRotate = true, 5000);
});

// lights — stronger directional shading for 3D depth
scene.add(new THREE.AmbientLight(0x8899cc, 0.42));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
keyLight.position.set(12, 24, 10);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x4f8cff, 0.75);
rimLight.position.set(-14, 10, -16);
scene.add(rimLight);

// starfield
{
  const n = 1400, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 90 + Math.random() * 120, t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(p) * Math.cos(t);
    pos[i*3+1] = Math.abs(r * Math.cos(p)) * 0.6 - 6;
    pos[i*3+2] = r * Math.sin(p) * Math.sin(t);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x3a4a6a, size: 0.35, sizeAttenuation: true })));
}

// reflective floor: mirror + dark veil + grid
{
  const reflector = new Reflector(new THREE.PlaneGeometry(120, 120), {
    clipBias: 0.003,
    textureWidth: Math.floor(window.innerWidth * 0.5),
    textureHeight: Math.floor(window.innerHeight * 0.5),
    color: 0x18223a,
  });
  reflector.rotation.x = -Math.PI / 2;
  reflector.position.y = -0.08;
  scene.add(reflector);

  const veil = new THREE.Mesh(
    new THREE.PlaneGeometry(120, 120),
    new THREE.MeshBasicMaterial({ color: 0x05070d, transparent: true, opacity: 0.84, depthWrite: false })
  );
  veil.rotation.x = -Math.PI / 2;
  veil.position.y = -0.05;
  scene.add(veil);
}
const grid = new THREE.GridHelper(90, 45, 0x1c2a4a, 0x101a30);
grid.position.y = -0.02;
scene.add(grid);

/* ---------- billboards (only labels face camera; shapes stay fixed) ---------- */
const billboards = [];

/* ---------- extruded 3D labels ---------- */
function makeLabel3D(text, { size = 0.34, depth = 0.055, frontColor = 0xeaf2ff, sideColor = 0x2c3a58 } = {}) {
  const geo = new TextGeometry(text, {
    font: FONT, size, depth,
    curveSegments: 2,
    bevelEnabled: true,
    bevelThickness: size * 0.045,
    bevelSize: size * 0.028,
    bevelSegments: 1,
  });
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const w = bb.max.x - bb.min.x;
  geo.translate(-bb.min.x - w / 2, 0, 0);
  const frontMat = new THREE.MeshStandardMaterial({
    color: frontColor, emissive: 0x8fb4ff, emissiveIntensity: 0.30,
    roughness: 0.3, metalness: 0.2, transparent: true,
  });
  const sideMat = new THREE.MeshStandardMaterial({
    color: sideColor, roughness: 0.55, metalness: 0.3, transparent: true,
  });
  const mesh = new THREE.Mesh(geo, [frontMat, sideMat]);
  return { mesh, mats: [frontMat, sideMat] };
}

/* ---------- SDF text (small utility labels) ---------- */
const LABEL_FONT = 'https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.2.5/files/ibm-plex-mono-latin-500-normal.woff';
function makeSDFLabel(text, { size = 0.26, color = '#8fa3cc' } = {}) {
  const t = new Text();
  t.text = text;
  t.font = LABEL_FONT;
  t.fontSize = size;
  t.color = new THREE.Color(color);
  t.anchorX = 'center';
  t.anchorY = 'bottom';
  t.outlineWidth = 0.022;
  t.outlineColor = new THREE.Color(0x05070d);
  t.outlineOpacity = 0.9;
  t.sync();
  return t;
}

/* ---------- site platforms ---------- */
function makePlatform(cx, cz, w, d, color, label) {
  const geo = new THREE.BoxGeometry(w, 0.35, d);
  const mat = new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.16, roughness: 0.4, metalness: 0.6 });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(cx, 0.05, cz);
  scene.add(m);
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.75 })
  );
  edges.position.copy(m.position);
  scene.add(edges);
  const l3d = makeLabel3D(label, { size: 0.95, depth: 0.12, frontColor: 0xc8d4ee, sideColor: 0x27334e });
  l3d.mesh.position.set(cx, 0.65, cz + d / 2 + 1.1);
  scene.add(l3d.mesh);
  billboards.push(l3d.mesh);
}
makePlatform(-12.2, -1.5, 13.5, 13.5, 0x4f8cff, 'SITE A · NAS HUB');
makePlatform(9.75, -4, 7.5, 8.5, 0x2fe6a8, 'SITE B · SATELLITE');

/* ---------- nodes (extruded logo shapes, fixed in 3D) ---------- */
const nodeById = {};
const pickables = [];
const RING_GEO = new THREE.RingGeometry(0.82, 1.02, 48);
const DISC_GEO = new THREE.CircleGeometry(0.82, 48);

function makeNode(def) {
  const cat = CATEGORIES[def.cat];
  const isOverlay = def.cat === 'net';
  const group = new THREE.Group();

  // extruded logo geometry (shared cache), fixed orientation
  const { geos, flipY } = getIconGeos(def.icon);
  const holder = new THREE.Group();
  // brand-native color for known slugs; category color for monograms
  const shapeColor = BRAND[def.icon] !== undefined
    ? visibleBrand(BRAND[def.icon])
    : new THREE.Color(cat.color).multiplyScalar(1.15);
  const frontMat = new THREE.MeshStandardMaterial({
    color: shapeColor,
    emissive: shapeColor, emissiveIntensity: 0.12,
    roughness: 0.3, metalness: 0.55, transparent: true,
    side: THREE.DoubleSide, // required: holder scale.y=-1 flips winding (raycast culling)
  });
  const sideMat = new THREE.MeshStandardMaterial({
    color: shapeColor.clone().multiplyScalar(0.45),
    roughness: 0.55, metalness: 0.35, transparent: true,
    side: THREE.DoubleSide,
  });
  for (const g of geos) {
    const m = new THREE.Mesh(g, [frontMat, sideMat]);
    m.userData.nodeDef = def;
    pickables.push(m);
    holder.add(m);
  }
  if (flipY) holder.scale.y = -1; // SVG y-down → upright; renderer flips winding
  if (isOverlay) holder.scale.multiplyScalar(1.22);
  group.add(holder);

  // invisible hit-proxy (wordmark glyphs have gaps — bbox center may be empty)
  const hitProxy = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 1.8, 0.8),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  hitProxy.userData.nodeDef = def;
  pickables.push(hitProxy);
  group.add(hitProxy);

  // category ring pedestal (fixed, XZ plane)
  const ringMat = new THREE.MeshBasicMaterial({ color: cat.color, transparent: true, opacity: 0.85, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(RING_GEO, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = -1.05;
  const discMat = new THREE.MeshBasicMaterial({ color: cat.color, transparent: true, opacity: 0.14, side: THREE.DoubleSide, depthWrite: false });
  const disc = new THREE.Mesh(DISC_GEO, discMat);
  disc.rotation.x = -Math.PI / 2;
  disc.position.y = -1.05;
  if (isOverlay) { ring.scale.setScalar(1.22); disc.scale.setScalar(1.22); }
  group.add(ring, disc);

  // glow halo — subtle
  const halo = makeGlowSprite(cat.color);
  halo.scale.setScalar(isOverlay ? 2.1 : 1.7);
  group.add(halo);

  // extruded 3D label — billboarded for readability
  const l3d = makeLabel3D(def.label, {
    size: isOverlay ? 0.4 : 0.34,
    frontColor: def.cat === 'client' ? 0xffffff : 0xeaf2ff,
    sideColor: new THREE.Color(cat.color).multiplyScalar(0.45).getHex(),
  });
  const labelBb = new THREE.Group();
  labelBb.add(l3d.mesh);
  labelBb.position.y = isOverlay ? 1.7 : 1.35;
  group.add(labelBb);
  billboards.push(labelBb);

  group.position.fromArray(def.pos);
  scene.add(group);

  nodeById[def.id] = {
    def, group, holder, frontMat, sideMat, halo, ring, disc,
    baseY: def.pos[1],
    baseEmissive: 0.12,
    dimMats: [
      { mat: frontMat, base: 1 },
      { mat: sideMat, base: 1 },
      { mat: halo.material, base: 1 },
      { mat: ringMat, base: 0.85 },
      { mat: discMat, base: 0.14 },
      { mat: l3d.mats[0], base: 1 },
      { mat: l3d.mats[1], base: 1 },
    ],
  };
  return nodeById[def.id];
}

function makeGlowSprite(color) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const ctx = cv.getContext('2d');
  const grad = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
  const c = '#' + color.toString(16).padStart(6, '0');
  grad.addColorStop(0, c + '66');
  grad.addColorStop(0.35, c + '2a');
  grad.addColorStop(1, c + '00');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
}

NODES.forEach(makeNode);

/* ---------- links: base line + shader pulse tube ---------- */
const linkGroups = {};
Object.keys(LAYERS).forEach(k => { linkGroups[k] = new THREE.Group(); scene.add(linkGroups[k]); });

const tubeMats = [];
const tubePickables = [];
const linkStates = []; // { def, line, tubeMat, label }

const tubeVert = `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
`;
const tubeFrag = `
  uniform vec3 uColor;
  uniform float uTime, uOffset, uDim, uBoost;
  varying vec2 vUv;
  void main() {
    float x = vUv.x;
    float pulse = 0.0;
    for (int i = 0; i < 2; i++) {
      float pos = fract(uTime * 0.11 + uOffset + float(i) * 0.5);
      pulse += smoothstep(0.09, 0.0, abs(x - pos));
    }
    float a = (0.06 + pulse * 0.85) * uDim;
    gl_FragColor = vec4(uColor * uBoost, a);
  }
`;

function makeLink(def) {
  const A = nodeById[def.a], B = nodeById[def.b];
  if (!A || !B) return;
  const pa = A.group.position, pb = B.group.position;
  const mid = pa.clone().add(pb).multiplyScalar(0.5);
  const dist = pa.distanceTo(pb);
  mid.y += Math.min(2.2 + dist * 0.16, 7.5);
  const curve = new THREE.QuadraticBezierCurve3(pa.clone(), mid, pb.clone());

  const layerCfg = LAYERS[def.layer];
  const pts = curve.getPoints(60);
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geo, def.dashed
    ? new THREE.LineDashedMaterial({ color: layerCfg.color, transparent: true, opacity: 0.34, dashSize: 0.5, gapSize: 0.35 })
    : new THREE.LineBasicMaterial({ color: layerCfg.color, transparent: true, opacity: 0.42 }));
  if (def.dashed) line.computeLineDistances();
  linkGroups[def.layer].add(line);

  // glow pulse tube
  const tubeMat = new THREE.ShaderMaterial({
    vertexShader: tubeVert, fragmentShader: tubeFrag,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uColor: { value: new THREE.Color(layerCfg.color) },
      uTime: { value: 0 },
      uOffset: { value: Math.random() },
      uDim: { value: 1 },
      uBoost: { value: 1 },
    },
  });
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.045, 5, false), tubeMat);
  tube.userData.linkDef = def;
  linkGroups[def.layer].add(tube);
  tubeMats.push(tubeMat);
  tubePickables.push(tube);

  let label = null;
  if (def.label) {
    label = makeSDFLabel(def.label, { size: 0.26, color: '#8fa3cc' });
    label.position.copy(curve.getPoint(0.5));
    label.position.y += 0.55;
    linkGroups[def.layer].add(label);
  }

  linkStates.push({ def, line, tubeMat, label, baseLineOpacity: line.material.opacity });
}

LINKS.forEach(makeLink);

// adjacency for focus dimming
const adjacency = {};
NODES.forEach(n => { adjacency[n.id] = new Set(); });
LINKS.forEach(l => { if (adjacency[l.a]) adjacency[l.a].add(l.b); if (adjacency[l.b]) adjacency[l.b].add(l.a); });

/* ---------- legend + layer toggles ---------- */
const legend = document.getElementById('legend');
Object.values(CATEGORIES).forEach(c => {
  const el = document.createElement('div');
  el.className = 'lg-item';
  el.innerHTML = `<span class="lg-dot" style="background:#${c.color.toString(16).padStart(6,'0')};color:#${c.color.toString(16).padStart(6,'0')}"></span>${c.label}`;
  legend.appendChild(el);
});

const toggles = document.getElementById('layer-toggles');
Object.entries(LAYERS).forEach(([key, cfg]) => {
  const label = document.createElement('label');
  label.innerHTML = `<input type="checkbox" checked data-layer="${key}"> ${cfg.label}`;
  label.querySelector('input').addEventListener('change', e => {
    linkGroups[key].visible = e.target.checked;
  });
  toggles.appendChild(label);
});

/* ---------- picking / focus / info panel ---------- */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredNode = null;
let hoveredTube = null;
let selected = null;

const infoEl = document.getElementById('info');
document.getElementById('info-close').addEventListener('click', () => deselect());

function setEmissive(node, on) {
  node.frontMat.emissiveIntensity = on ? 0.4 : node.baseEmissive;
}

function pick(ev) {
  mouse.x = (ev.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(ev.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hitsN = raycaster.intersectObjects(pickables, false);
  if (hitsN.length) return { node: nodeById[hitsN[0].object.userData.nodeDef.id], tube: null };
  const hitsT = raycaster.intersectObjects(tubePickables, false);
  if (hitsT.length) return { node: null, tube: hitsT[0].object };
  return { node: null, tube: null };
}

function applyFocus(selectedId) {
  const keep = selectedId ? adjacency[selectedId] : null;
  for (const id in nodeById) {
    const n = nodeById[id];
    const dimmed = keep && id !== selectedId && !keep.has(id);
    const f = dimmed ? 0.15 : 1;
    for (const dm of n.dimMats) dm.mat.opacity = dm.base * f;
    if (id !== selectedId) n.frontMat.emissiveIntensity = dimmed ? 0.02 : n.baseEmissive;
  }
  for (const ls of linkStates) {
    const involved = keep && (ls.def.a === selectedId || ls.def.b === selectedId);
    ls.line.material.opacity = !keep ? ls.baseLineOpacity : involved ? 0.9 : 0.04;
    ls.tubeMat.uniforms.uDim.value = !keep ? 1 : involved ? 1.5 : 0.05;
    if (ls.label) ls.label.fillOpacity = !keep ? 1 : involved ? 1 : 0.05;
  }
}

function flyToNode(node) {
  const p = node.group.position.clone();
  const dir = camera.position.clone().sub(p).normalize();
  const camPos = p.clone().add(dir.multiplyScalar(8.5)).add(new THREE.Vector3(0, 1.6, 0));
  const tgt = p.clone().add(new THREE.Vector3(0, 0.8, 0));
  flyTo(camPos, tgt, 1.4);
}

function select(node) {
  if (selected && selected !== node) setEmissive(selected, false);
  selected = node;
  controls.autoRotate = false;
  clearTimeout(idleTimer);
  setEmissive(node, true);
  applyFocus(node.def.id);
  flyToNode(node);
  document.getElementById('info-name').textContent = node.def.label;
  document.getElementById('info-cat').textContent =
    CATEGORIES[node.def.cat].label + (node.def.site ? ` · site ${node.def.site}` : '');
  document.getElementById('info-desc').textContent = node.def.desc;
  document.getElementById('info-tags').innerHTML =
    (node.def.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  infoEl.classList.add('open');
}

function deselect() {
  if (selected) setEmissive(selected, false);
  selected = null;
  infoEl.classList.remove('open');
  applyFocus(null);
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!selected) controls.autoRotate = true; }, 5000);
}

// click vs drag discrimination
let downPos = null;
renderer.domElement.addEventListener('pointerdown', ev => { downPos = [ev.clientX, ev.clientY]; });

renderer.domElement.addEventListener('pointermove', ev => {
  const { node, tube } = pick(ev);
  if (hoveredNode && hoveredNode !== node && hoveredNode !== selected) setEmissive(hoveredNode, false);
  hoveredNode = node;
  if (hoveredNode && hoveredNode !== selected) setEmissive(hoveredNode, true);

  if (hoveredTube && hoveredTube !== tube) hoveredTube.material.uniforms.uBoost.value = 1;
  hoveredTube = tube;
  if (hoveredTube) hoveredTube.material.uniforms.uBoost.value = 2.4;

  renderer.domElement.style.cursor = (hoveredNode || hoveredTube) ? 'pointer' : 'default';
});

renderer.domElement.addEventListener('click', ev => {
  if (downPos && Math.hypot(ev.clientX - downPos[0], ev.clientY - downPos[1]) > 5) return; // was a drag
  const { node } = pick(ev);
  if (node) select(node);
  else deselect();
});

/* ---------- post-processing ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.45, 0.55, 0.88);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// grade: vignette + film grain (LDR, after tone mapping)
const GradeShader = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uVignette: { value: 1.1 }, uGrain: { value: 0.05 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime, uVignette, uGrain;
    varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7)) + mod(uTime, 10.0) * 13.0) * 43758.5453); }
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 d = vUv - 0.5;
      float v = smoothstep(0.95, 0.35, dot(d, d) * uVignette * 2.0);
      c.rgb *= mix(0.72, 1.0, v);
      c.rgb += (hash(vUv * vec2(1920.0, 1080.0)) - 0.5) * uGrain * 0.35;
      gl_FragColor = c;
    }
  `,
};
const gradePass = new ShaderPass(GradeShader);
composer.addPass(gradePass);

const smaaPass = new SMAAPass(window.innerWidth * renderer.getPixelRatio(), window.innerHeight * renderer.getPixelRatio());
composer.addPass(smaaPass);

/* ---------- resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- animate ---------- */
const clock = new THREE.Clock();
let fpsEMA = 60;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  fpsEMA += (1 / Math.max(dt, 1e-4) - fpsEMA) * 0.05;

  // camera animation
  if (camAnim) {
    camAnim.t += dt / camAnim.dur;
    const k = easeInOutCubic(Math.min(camAnim.t, 1));
    camera.position.lerpVectors(camAnim.fromP, camAnim.toP, k);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, k);
    camera.lookAt(controls.target);
    if (camAnim.t >= 1) {
      const done = camAnim.done;
      camAnim = null;
      controls.enabled = true;
      if (done) done();
    }
  } else {
    controls.update();
  }

  // billboards face camera
  for (const b of billboards) b.quaternion.copy(camera.quaternion);

  // gentle node float + halo pulse
  for (const id in nodeById) {
    const n = nodeById[id];
    const phase = id.length * 1.37;
    n.group.position.y = n.baseY + Math.sin(t * 0.9 + phase) * 0.09;
    const s = (n.def.cat === 'net' ? 2.1 : 1.7) * (1 + Math.sin(t * 1.6 + phase) * 0.07);
    n.halo.scale.setScalar(s);
  }

  // shader pulse time
  for (const m of tubeMats) m.uniforms.uTime.value = t;
  gradePass.uniforms.uTime.value = t;

  composer.render();
}

animate();
window.__infraDebug = {
  nodeById, camera, controls, THREE, linkGroups, linkStates, tubeMats, billboards,
  get fps() { return fpsEMA; },
};
document.getElementById('loader').classList.add('done');

// cinematic intro
flyTo(HOME_CAM, HOME_TGT, 2.6, () => { controls.autoRotate = true; });
</script>
</body>
</html>
